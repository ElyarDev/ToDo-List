<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To DO List</title>

    <!-- bootstrap  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
        integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- css  -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

</head>

<body class="bg-dark">

    <div class="box bg-info p-4 rounded-4 shadow w-50">
        <h2 class="text-center">📝 My Todo List</h2>

        <div class="d-flex mb-4">
            <input type="text" id="taskInput" class="form-control" placeholder="لطفا کار مورد نظر را وارد کنید...">
            <button id="addBtn" class="btn btn-success px-5">افزودن</button>
        </div>


        <ul id="taskList" class="list-unstyled">
            <li class="d-none">
                <span class="fw-bold">ایتم تستی</span>
                <div>
                    <button class="btn btn-warning">⏳ در حال انجام</button>
                    <button class="btn btn-success">✔ انجام شده</button>
                    <button class="btn btn-danger">❌ حذف</button>
                </div>
            </li>

        </ul>
    </div>
    <script src="./assets/js/script.js"></script>
</body>

</html>
